<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <header class="h cadastro">
        <h1>Antes de Jogar Fora</h1>
    </header>

    <main>
        <h2>Cadastrar Item</h2>
        <p>Forneça os detalhes do item que deseja destinar</p>

        <form action="cadastro">

            <label for="name">Nome do Item</label><br>
            <input type="text" id="name"
            placeholder="Ex.: Mesa"><br>

            <label for="type">Categoria</label><br>
            <select id="type">
                <option>Móveis</option>
                <option>Eletrônico</option>
                <option>Eletrodomésticos</option>
                <option>Roupas</option>
                <option>Livros</option>
                <option>Brinquedos</option>
                <option>Outros</option>
            </select><br>

            <label for="dcs">Descrição:</label><br>
            <textarea id="dcs"
            name="Descrição"
            placeholder="Detalhes sobre o item..."
            cols="40"
            rows="10">
            </textarea><br>
        
            <label for="state">Estado de Consevação</label><br>
            <input type="radio"
            name="state" id="new">
            <label for="new">Novo</label><br>

            <input type="radio"
            name="state" id="ok">
            <label for="ok">Semi-novo/Usado</label><br>

            <input type="radio"
            name="state" id="bad">
            <label for="bad">Precisa de Reparos</label><br>

            <button type="button"><a href="cadastro 2.html">Próximo Passo</a></button>
        </form>    
    </main>

    <footer>

    </footer>
</body>
</html>
