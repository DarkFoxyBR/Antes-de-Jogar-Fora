<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="confirmacao-page">

    <div class="confirmacao-container">

        <header class="confirmacao-header">
            <div class="confirmacao-badge">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h1>Antes de Jogar Fora</h1>
        </header>

        <main class="confirmacao-main">
            <div class="confirmacao-icon">
                <i class="fa-solid fa-check"></i>
            </div>

            <h2>Cadastro concluído!</h2>

            <p>
                Tudo certo. Seu item foi enviado com sucesso e o destino foi registrado no nosso sistema.
            </p>

            <div class="confirmacao-detalhes">
                <span><i class="fa-solid fa-box-open"></i> Cadastro finalizado</span>
                <span><i class="fa-solid fa-leaf"></i> Ação sustentável registrada</span>
            </div>
        </main>

        <footer class="confirmacao-footer">
            <a href="index.html" class="btn-confirmacao btn-principal btn-fechar">Fechar</a>
        </footer>
    </div>

</body>
</html>
