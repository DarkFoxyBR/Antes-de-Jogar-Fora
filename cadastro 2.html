<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cadastro-2-page">
    <header class="h cadastro">
        <h1>Antes de Jogar Fora</h1>
    </header>

    <main class="cadastro-2-main">
        <h2>O que você deseja fazer com este item?</h2>
        <p>Escolha o melhor destino para o seu produto. Nossa comunidade valoriza a sustentabilidade e o consumo consciente.</p>
        <form action="cadastro">
            <label for="final">Escolha o destino</label><br>
            <input type="radio"
            name="final" id="donate">
            <label for="donate">Doar</label><br>

            <input type="radio"
            name="final" id="sell">
            <label for="sell">Vender</label><br>

            <input type="radio"
            name="final" id="recycle">
            <label for="recycle">Reciclar</label><br>
        </form>
    </main>

    <footer>
        <button type="button" class="btn-back"><a href="cadastro1.html">Voltar</a></button>
        <button type="submit" class="btn-submit">Continuar</button>
    </footer>
</body>
</html>
